# Tests every push and pull request. On a push to main it also picks the next
# version from the commit messages, tags it, builds the mcpackctl CLI and the
# IDISMAM desktop app, and publishes them as a GitHub release.
#
# Version bumps follow Conventional Commits since the last v* tag:
#   feat: ...                    -> minor (v0.1.0 -> v0.2.0)
#   fix: ..., docs: ..., others  -> patch (v0.1.0 -> v0.1.1)
#   feat!: ... / BREAKING CHANGE -> major (v0.1.0 -> v1.0.0)
# Put [skip release] in the head commit message to push to main without
# releasing.
#
# The Windows programs are signed through SignPath (free code signing for
# open-source projects, certificate by SignPath Foundation) once these are
# set in the repository settings. Until then releases are published
# unsigned. See "Code signing" in the README.
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
#   variable SIGNPATH_PROJECT_SLUG           (default: IDISMAM)
#   variable SIGNPATH_SIGNING_POLICY_SLUG    (default: release-signing)
name: Build and release

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Releases from main run one at a time so two pushes never pick the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Vet the desktop app
        if: runner.os == 'Windows'
        run: go vet -tags desktop,production ./cmd/idismam
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  version:
    name: Pick version
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the next version
        id: next
        shell: bash
        run: |
          set -euo pipefail
          # A re-run of a commit that is already tagged releases that tag again.
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -n "$existing" ]; then
            echo "HEAD is already $existing"
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged HEAD | sort -V | tail -n1)
          if [ -z "$last" ]; then
            base=v0.0.0
            range=HEAD
          else
            base=$last
            range="$last..HEAD"
          fi
          if [ -z "$(git rev-list "$range")" ]; then
            echo "No commits since $last; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subjects=$(git log --format='%s' "$range")
          bodies=$(git log --format='%b' "$range")
          IFS=. read -r major minor patch <<< "${base#v}"
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$subjects" || grep -q 'BREAKING CHANGE' <<< "$bodies"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$subjects"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          tag="v${major}.${minor}.${patch}"
          echo "Last release: ${last:-none}. Next: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Push the tag
        if: steps.next.outputs.release == 'true'
        shell: bash
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

  cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Add the version details
        if: matrix.goos == 'windows'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --manifest cli \
            --product-name mcpackctl --file-description mcpackctl \
            --product-version "${TAG#v}" --file-version "${TAG#v}" \
            --copyright "Copyright (c) bhhoang. MIT License." \
            --original-filename mcpackctl.exe --out cmd/mcpackctl/rsrc
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/bhhoang/IDISMAM/internal/cmd.version=$TAG" \
            -o "dist/mcpackctl-$TAG-$GOOS-$GOARCH${{ matrix.ext }}" ./cmd/mcpackctl
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  gui:
    name: Desktop app (windows/amd64)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Add the icon and version details
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Windows shows these in the file's properties and in its own
          # prompts; the manifest is the usual one for a desktop app.
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --manifest gui \
            --icon cmd/idismam/build/appicon.png \
            --product-name IDISMAM --file-description IDISMAM \
            --product-version "${TAG#v}" --file-version "${TAG#v}" \
            --copyright "Copyright (c) bhhoang. MIT License." \
            --original-filename IDISMAM.exe --out cmd/idismam/rsrc
      - name: Build
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          go build -trimpath -tags desktop,production \
            -ldflags "-s -w -H windowsgui -X main.version=$TAG" \
            -o "dist/IDISMAM-$TAG-windows-amd64.exe" ./cmd/idismam
      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows-amd64
          path: dist/*
          if-no-files-found: error

  sign:
    name: Sign the Windows programs
    needs: [version, cli, gui]
    runs-on: ubuntu-latest
    # A release signing request waits for an approver to approve it in
    # SignPath; the job waits up to five hours for that.
    timeout-minutes: 320
    permissions:
      actions: read
      contents: read
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    outputs:
      signed: ${{ steps.setup.outputs.enabled }}
    steps:
      - name: Check that signing is set up
        id: setup
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SignPath is not set up, so the Windows programs are released unsigned. See Code signing in the README."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: gui-windows-amd64
          path: unsigned
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-amd64
          path: unsigned
      - name: Upload the programs to sign
        id: unsigned
        if: steps.setup.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/*
          if-no-files-found: error
      - name: Sign with SignPath
        if: steps.setup.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'IDISMAM' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed
      - name: Use the unsigned programs
        if: steps.setup.outputs.enabled != 'true'
        run: mkdir -p signed && cp unsigned/* signed/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: signed/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, cli, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Everything except the unsigned Windows builds, which the sign job
      # replaced.
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-darwin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Copy for AutoPack's updater
        working-directory: dist
        env:
          TAG: ${{ needs.version.outputs.tag }}
        # The app was called AutoPack up to v0.2.0, and those copies update
        # to the file named AutoPack-<tag>-windows-amd64.exe. The same
        # IDISMAM program under that name lets them update into IDISMAM.
        run: cp "IDISMAM-$TAG-windows-amd64.exe" "AutoPack-$TAG-windows-amd64.exe"
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SIGNED: ${{ needs.sign.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            windows='The Windows programs are signed; the publisher Windows shows is **SignPath Foundation**. A brand-new version can still get a "Windows protected your PC" message for a few days until Windows knows the download: choose **More info**, then **Run anyway**.'
          else
            windows='This release is not signed, so Windows may show "Windows protected your PC": choose **More info**, then **Run anyway**.'
          fi
          cat > notes.md <<EOF
          ## Downloads

          - **IDISMAM-$TAG-windows-amd64.exe**: the desktop app for Windows 10 and 11. Download it and double-click it; nothing needs installing.
          - **AutoPack-$TAG-windows-amd64.exe**: the same app under its old name, so AutoPack v0.2.0 and older can update to it. New downloads should use the IDISMAM file.
          - **mcpackctl-$TAG-&lt;os&gt;-&lt;arch&gt;**: the command-line tool for Windows, Linux and macOS.
          - **SHA256SUMS.txt**: checksums to verify the downloads.

          $windows
          EOF
          if [ "$SIGNED" = "true" ]; then
            printf '\nFree code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).\n' >> notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --generate-notes --verify-tag
          fi
